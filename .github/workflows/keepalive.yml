name: Keep backend awake

# El plan gratuito de Render duerme el servicio tras ~15 min sin tráfico y el primer request
# tarda 30 s o más. Este ping cada 10 min lo mantiene despierto.
# Configura la variable de repositorio BACKEND_URL (Settings > Secrets and variables > Actions >
# Variables), p. ej. https://statsbasketball-backend.onrender.com
# Nota: 24/7 consume ~744 h/mes de las 750 h gratuitas de Render para UN servicio.
# Si prefieres limitarlo a horarios de partido, cambia el cron (la hora es UTC).

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.BACKEND_URL != '' }}
    steps:
      - name: Ping /health
        run: curl --fail --silent --show-error --max-time 60 --retry 2 "${{ vars.BACKEND_URL }}/health"
