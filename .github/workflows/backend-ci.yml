name: Backend CI

on:
  push:
    branches: [master]
    paths: ["estadisticas_backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["estadisticas_backend/**", ".github/workflows/backend-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: estadisticas_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: estadisticas_backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (errores reales: sintaxis, nombres indefinidos, imports rotos)
        run: ruff check app tests --select E9,F63,F7,F82
      - name: Tests (SQLite en memoria; no requiere Supabase)
        run: python -m pytest -q
      - name: Alembic - la migración carga y genera SQL
        env:
          DATABASE_URL: postgresql://u:p@localhost:6543/x
        run: python -m alembic upgrade head --sql > /dev/null
